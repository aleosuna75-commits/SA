<title>Busca Nido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/*MAPLIBRE_CSS*/
</style>
<style>
/* Layout: el mapa ocupa toda la pantalla; encima flotan la barra de búsqueda con filtros (arriba), los botones de capas (derecha)
   y una hoja inferior con la lista y el detalle. En escritorio la hoja se vuelve un panel a la izquierda.
   Un solo tema claro a propósito: el mapa es claro y la interfaz lo acompaña. Acento jacaranda, el árbol morado de la CDMX. */
:root{
  color-scheme:light;
  --bg:#f6f5f8; --surface:#ffffff; --surface-2:#f1eff5; --line:#e4e0ec; --line-2:#cdc6da;
  --fg:#1d1a24; --fg-2:#545066; --fg-3:#837e93;
  --accent:#7b3fc4; --accent-2:#9b6ad8; --accent-soft:#efe6fb; --accent-ink:#ffffff;
  --good:#0f7b4c; --good-soft:#dcf3e7; --bad:#b4322f; --bad-soft:#fbe3e2; --warn:#8a5a00; --warn-soft:#fdf0d2;
  --metro:#e8681e; --tren:#1f6fd1; --cable:#0b8f8a;
  --shadow:0 6px 20px rgba(29,26,36,.16); --shadow-2:0 2px 8px rgba(29,26,36,.14);
  --display:"Outfit","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --top:env(safe-area-inset-top, 0px); --bot:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.oj{width:1.25em;height:1.25em;vertical-align:-.28em;display:inline-block}
#map{position:fixed;inset:0;background:#e9e6df}
#ui{position:fixed;inset:0;pointer-events:none;padding-left:var(--gl);padding-right:var(--gr)}
#ui>*{pointer-events:auto}

/* barra superior */
.top{position:absolute;left:var(--gl);right:var(--gr);top:calc(10px + var(--top));display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.top.abierta{z-index:8}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:6px 6px 6px 14px;position:relative}
.brand{font:800 15px/1 var(--display);color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand .oj{width:22px;height:22px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;padding:9px 2px;font-size:15px}
.search input::placeholder{color:var(--fg-3)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fg-2);font-size:18px}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .oj{width:24px;height:24px}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font:700 11px/18px var(--body);text-align:center;padding:0 5px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);max-height:min(60vh,420px);overflow:auto;padding:6px}
.sug button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px}
.sug button:hover,.sug button.on{background:var(--surface-2)}
.sug small{color:var(--fg-3);margin-left:auto;font-size:12px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-2);font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .oj{width:18px;height:18px}

/* botones flotantes del mapa */
.mapbtns{position:absolute;right:var(--gr);top:calc(122px + var(--top));display:flex;flex-direction:column;gap:8px;z-index:4}
.mapbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-2);display:grid;place-items:center;font:700 13px/1 var(--display);color:var(--fg-2)}
.mapbtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.mapbtn .oj{width:24px;height:24px}

/* hoja inferior / panel lateral */
#sheet{position:absolute;left:0;right:0;bottom:0;height:calc(100% - 64px - var(--top));background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(29,26,36,.14);z-index:6;display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek)));transition:transform .28s cubic-bezier(.2,.8,.2,1);--peek:150px;touch-action:none}
#sheet[data-s="mid"]{transform:translateY(48%)}
#sheet[data-s="full"]{transform:translateY(0)}
#sheet.drag{transition:none}
.handle{padding:9px 0 4px;display:grid;place-items:center;cursor:grab;flex:none}
.handle i{width:42px;height:5px;border-radius:3px;background:var(--line-2)}
.sheet-in{flex:1;min-height:0;display:flex;flex-direction:column;padding-left:var(--gl);padding-right:var(--gr)}
.lh{display:flex;align-items:center;gap:10px;padding:2px 0 10px;flex:none;flex-wrap:wrap}
.lh h2{margin:0;font:700 19px/1.15 var(--display);letter-spacing:-.01em;flex:1;min-width:160px}
.lh h2 small{display:block;font:500 12.5px/1.3 var(--body);color:var(--fg-3);margin-top:3px}
.sel{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--surface);font-size:13px;font-weight:600}
.scroll{flex:1;min-height:0;overflow:auto;touch-action:pan-y;padding-bottom:calc(90px + var(--bot));margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding-left:var(--gl);padding-right:var(--gr)}
@media (max-width:899.98px){ /* en el teléfono el arrastre de la hoja lo maneja el JS; el panel de escritorio se recorre normal */
#sheet:not([data-s="full"]) .scroll{touch-action:none}
#sheet[data-s="full"].arriba .scroll{touch-action:pan-down}
#sheet:not([data-s="full"]) .gal{touch-action:pan-x}
#sheet[data-s="full"].arriba .gal{touch-action:pan-x pan-down}
}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg-2)}
.toggle input{accent-color:var(--accent);width:18px;height:18px}

/* tarjetas */
.card{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;align-items:start}
.card:first-child{border-top:0}
.card.on{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.thumb{width:96px;height:96px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .oj{width:46px;height:46px}
.thumb .src{position:absolute;left:5px;bottom:5px;right:5px;background:rgba(255,255,255,.92);border-radius:7px;font:700 10px/1.2 var(--body);padding:3px 5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.price{font:800 19px/1.1 var(--display);letter-spacing:-.01em}
.price small{font:500 12px var(--body);color:var(--fg-3)}
.mant{font-size:12px;color:var(--fg-3)}
.ttl{font-weight:600;font-size:14px;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.where{font-size:12.5px;color:var(--fg-2);margin-top:3px}
.facts{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:12.5px;color:var(--fg-2)}
.facts .oj{width:16px;height:16px;vertical-align:-.22em;margin-right:2px}
.pet{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:999px}
.pet.si{background:var(--good-soft);color:var(--good)} .pet.no{background:var(--bad-soft);color:var(--bad)} .pet.nd{background:var(--surface-2);color:var(--fg-3)}
.st{display:inline-block;font-weight:700;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-top:5px}
.fav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--fg-3)}
.fav[aria-pressed="true"]{color:#e0245e}
.more{width:100%;padding:14px;font-weight:700;color:var(--accent)}
.empty{text-align:center;color:var(--fg-2);padding:26px 10px}
.empty .oj{width:56px;height:56px;display:block;margin:0 auto 8px}

/* detalle */
.det-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex:none}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--accent);padding:6px 4px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;margin-bottom:12px}
.gal img{height:220px;width:auto;max-width:100%;border-radius:16px;scroll-snap-align:start;object-fit:cover;flex:none}
.nophoto{height:150px;border-radius:16px;background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;color:var(--fg-2);font-weight:600;text-align:center;padding:10px}
.nophoto .oj{width:54px;height:54px}
.dprice{font:800 30px/1.05 var(--display);letter-spacing:-.02em}
.dttl{font:600 17px/1.3 var(--body);margin:6px 0 2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.fact{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--fg-2)}
.fact b{display:block;font:700 16px/1.2 var(--display);color:var(--fg)}
.box{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px}
.box h3{margin:0 0 6px;font:700 14px var(--display)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14.5px;background:var(--surface-2);color:var(--fg);text-decoration:none;text-align:center}
.btn.main{background:var(--accent);color:#fff;grid-column:1/-1}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn .oj{width:20px;height:20px}
.btn:disabled{opacity:.5}
.pipe{display:flex;flex-wrap:wrap;gap:6px}
.pipe button{padding:7px 11px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600}
.pipe button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
textarea,.inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);outline:0;resize:vertical}
textarea:focus,.inp:focus{border-color:var(--accent)}
.note{font-size:12.5px;color:var(--fg-3)}
.warnbox{background:var(--warn-soft);color:#5c3c00;border-radius:14px;padding:10px 12px;font-size:13px;margin:10px 0}

/* botón agregar */
body.det #add{display:none}
body.pick #add,body.pick #chips,body.pick .mapbtns,body.pick #sheet{display:none!important}
body[data-sheet="mid"] #add,body[data-sheet="full"] #add{bottom:calc(18px + var(--bot))}
@media (min-width:900px){ body #add{display:flex!important} }
#add{position:absolute;right:var(--gr);bottom:calc(var(--peek, 150px) + 14px + var(--bot));z-index:7;display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:999px;background:var(--accent);color:#fff;font:700 15px/1 var(--display);box-shadow:0 8px 22px rgba(123,63,196,.4)}
#add .oj{width:22px;height:22px}

/* modales */
.veil{position:fixed;inset:0;background:rgba(20,16,28,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:16px var(--gr) calc(20px + var(--bot)) var(--gl);box-shadow:var(--shadow)}
@media (min-width:700px){ .veil{align-items:center} .modal{border-radius:24px;max-height:88%;padding:20px 22px} }
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mh h2{margin:0;font:800 21px/1.15 var(--display)}
.x{width:38px;height:38px;border-radius:50%;background:var(--surface-2);font-size:16px;flex:none}
.fld{margin:14px 0}
.fld>label,.fld>.lab{display:block;font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt .oj{width:18px;height:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-weight:600}
.mfoot{position:sticky;bottom:calc(-20px - var(--bot));background:var(--surface);padding:12px 0 4px;display:flex;gap:8px;margin-top:10px}
.mfoot .btn{flex:1}
.plat{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.plat:first-of-type{border-top:0}
.plat .pn{flex:1;min-width:0}
.plat b{display:block;font-size:15px}
.plat small{color:var(--fg-3);font-size:12.5px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:800 13px/1 var(--display);color:#fff;flex:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px}

/* modo elegir punto */
.pickbar{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(20px + var(--bot));z-index:9;background:var(--fg);color:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.pickbar span{flex:1;font-weight:600;font-size:14px}
.pickbar .btn{padding:9px 12px}
.cross{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-34px 0 0 -17px;z-index:8;pointer-events:none}
.cross .oj{width:34px;height:34px}

#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(130px + var(--top));z-index:30;background:var(--fg);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(92vw,440px);box-shadow:var(--shadow);text-align:center}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:var(--bg);font:700 18px var(--display);color:var(--accent);transition:opacity .3s}
.loading div{display:flex;flex-direction:column;align-items:center;gap:10px}
.loading .oj{width:64px;height:64px}
.maplibregl-ctrl-attrib{font-size:10.5px}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--peek,150px) - 4px)}

@media (min-width:900px){
  .top{left:20px;right:auto;width:420px}
  #sheet{left:20px;right:auto;top:calc(128px + var(--top));bottom:20px;height:auto;width:420px;border-radius:22px;transform:none!important;box-shadow:var(--shadow)}
  .handle{display:none}
  .sheet-in{padding:14px 16px 0}
  .scroll{margin:0 -16px;padding:0 16px 20px}
  #add{bottom:24px;right:24px}
  .mapbtns{top:20px;right:20px}
  .maplibregl-ctrl-bottom-right{bottom:0}
  #toast{top:24px}
}
@media (prefers-reduced-motion:reduce){ #sheet{transition:none} }
</style>

<div id="map" role="region" aria-label="Mapa de rentas de la Ciudad de México"></div>
<div id="ui">
  <div class="top">
    <div class="search">
      <span class="brand" aria-hidden="true" data-e="🏘"></span>
      <input id="q" type="search" autocomplete="off" placeholder="Busca colonia, alcaldía o metro" aria-label="Buscar colonia, alcaldía o estación de metro">
      <button class="iconbtn" data-a="filtros" aria-label="Filtros" style="position:relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg><span class="badge" id="nf" hidden></span></button>
      <div class="sug" id="sug" hidden role="listbox"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="mapbtns">
    <button class="mapbtn" data-a="3d" aria-pressed="false" aria-label="Vista 3D">3D</button>
    <button class="mapbtn" data-a="metro" aria-pressed="true" aria-label="Mostrar estaciones de metro" data-e="🚇"></button>
    <button class="mapbtn" data-a="plataformas" aria-label="Buscar en otras plataformas" data-e="🔗"></button>
    <button class="mapbtn" data-a="cdmx" aria-label="Ver toda la ciudad" data-e="🧭"></button>
  </div>
  <section id="sheet" data-s="peek" aria-label="Resultados">
    <div class="handle" id="handle" aria-hidden="true"><i></i></div>
    <div class="sheet-in" id="sheetin"></div>
  </section>
  <button id="add" data-a="agregar" aria-label="Agregar un anuncio que encontraste"><span aria-hidden="true" style="font-size:22px;line-height:1">＋</span><span>Agregar</span></button>
</div>
<div id="modal-root"></div>
<div id="toast" hidden role="status"></div>
<div class="loading" id="loading"><div><span aria-hidden="true" data-e="🏘"></span>Cargando el mapa de la CDMX…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
"use strict";
/* ============ íconos (OpenMoji, CC BY-SA 4.0) ============ */
const ICON = /*ICONOS*/{};
const ICON_URL = {};
const ic = e => { const k = e.replace(/️/g, ''); if (!ICON[k]) return e; ICON_URL[k] = ICON_URL[k] || URL.createObjectURL(new Blob([ICON[k]], {type: 'image/svg+xml'})); return `<img class="oj" src="${ICON_URL[k]}" alt="">`; };
function ojify(root){ /* reemplaza emojis sueltos en el HTML estático por los dibujos */
  root.querySelectorAll('[data-e]').forEach(el => { el.innerHTML = ic(el.dataset.e) + (el.dataset.t ? ' ' + el.dataset.t : ''); });
}

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().replace(/ñ/g, '\u0001').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\u0001/g, 'ñ').replace(/[^a-z0-9ñ ]/g, ' ').replace(/\s+/g, ' ').trim();
const slug = s => norm(s).replace(/ñ/g, 'n').replace(/ /g, '-');
const money = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-MX');
const short = n => n >= 100000 ? '$' + Math.round(n / 1000) + 'k' : n >= 10000 ? '$' + (Math.round(n / 100) / 10).toString().replace(/\.0$/, '') + 'k' : money(n);
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const hav = (a, b) => { const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r; const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const fmtDist = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.0', '') + ' km';
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3400); }
const TIPOS = {departamento: ['Departamento', '🏢'], casa: ['Casa', '🏠'], cuarto: ['Cuarto', '🛏'], loft: ['Loft', '🏙'], estudio: ['Estudio', '🛋'], otro: ['Otro', '🏘']};

}
function cerrarDetalle(){

/* ============ hoja inferior arrastrable (teléfono) ============ */
const sheet = $('#sheet');
function setSheet(s){ sheet.dataset.s = s; document.body.dataset.sheet = s; }
sheet.addEventListener('scroll', e => { if (e.target.classList && e.target.classList.contains('scroll')) arriba(); }, true);
(function(){ /* el arrastre empieza solo cuando el dedo se mueve: así los toques en botones siguen funcionando */
  let st = null;
  const H = () => sheet.getBoundingClientRect().height, pos = s => s === 'full' ? 0 : s === 'mid' ? H() * .48 : H() - 150;
  sheet.addEventListener('pointerdown', e => { if (window.innerWidth >= 900 || e.button > 0) return; if (e.target.closest('input,select,textarea')) return;
    st = {y: e.clientY, x: e.clientX, start: sheet.dataset.s, t0: pos(sheet.dataset.s), h: H(), id: e.pointerId, on: false, sc: e.target.closest('.scroll'), handle: !!e.target.closest('.handle')}; });
  window.addEventListener('pointermove', e => { if (!st || e.pointerId !== st.id) return; st.ly = e.clientY; const dy = e.clientY - st.y;
    if (!st.on) {
      if (Math.abs(dy) < 8 || Math.abs(dy) < Math.abs(e.clientX - st.x)) return;
      /* dentro de la lista en pantalla completa, el gesto es desplazar la lista, salvo que esté arriba y se jale hacia abajo */
      if (!st.handle && st.sc && st.start === 'full' && !(st.sc.scrollTop <= 0 && dy > 0)) { st = null; return; }
      st.on = true; sheet.classList.add('drag'); try { sheet.setPointerCapture(st.id); } catch (_) {} }
    sheet.style.transform = `translateY(${Math.min(st.h - 150, Math.max(0, st.t0 + dy))}px)`; e.preventDefault(); }, {passive: false});
  const up = e => { if (!st || e.pointerId !== st.id) return; const s0 = st; st = null; if (!s0.on) return;
    sheet.classList.remove('drag'); sheet.style.transform = ''; try { sheet.releasePointerCapture(s0.id); } catch (_) {}
    /* pointercancel llega sin coordenadas (clientY 0): se usa la última posición conocida para no invertir el gesto */
    const y = e.type === 'pointercancel' ? (s0.ly ?? s0.y) : e.clientY, dy = y - s0.y, t = s0.t0 + dy, hh = H(), opts = [['full', 0], ['mid', hh * .48], ['peek', hh - 150]];
    let best = opts.reduce((a, b) => Math.abs(b[1] - t) < Math.abs(a[1] - t) ? b : a)[0];
    if (Math.abs(dy) > 60) { const i = ['full', 'mid', 'peek'].indexOf(s0.start); best = ['full', 'mid', 'peek'][Math.max(0, Math.min(2, i + (dy > 0 ? 1 : -1)))]; }
    setSheet(best); sheet.dataset.justDragged = '1'; setTimeout(() => delete sheet.dataset.justDragged, 60); };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  sheet.addEventListener('click', e => {
    if (sheet.dataset.justDragged) { e.stopPropagation(); e.preventDefault(); return; }
    if (window.innerWidth >= 900) return;
    if (e.target.closest('.handle')) { const s = sheet.dataset.s; setSheet(s === 'peek' ? 'mid' : s === 'mid' ? 'full' : 'mid'); return; }
    if (sheet.dataset.s === 'peek' && !e.target.closest('button,a,input,select,textarea,label,.card')) setSheet('mid');
  }, true);
})();

/* distribución de rentas por precio: barras moradas = dentro del presupuesto elegido */
function histo(f){
  const W = 320, H = 86, B = 5000, N = 17, base = H - 18, cnt = new Array(N).fill(0);
  todos().forEach(a => { cnt[Math.min(N - 1, Math.floor(a.precio / B))]++; });
  const mx = Math.max(1, ...cnt), bw = W / N, lo = f.min || 0, hi = f.max || Infinity;
  const bars = cnt.map((c, i) => { const a = i * B, b = i === N - 1 ? Infinity : (i + 1) * B, on = b > lo && a <= hi, h = c ? Math.max(3, (base - 6) * c / mx) : 0, x = i * bw + 1, w = bw - 2, y = base - h, r = Math.min(4, h, w / 2);
    const lab = (i === N - 1 ? 'Más de ' + short(a) : short(a) + ' a ' + short(b)) + ': ' + c + (c === 1 ? ' renta' : ' rentas');
    return `<g data-a="hbin" data-i="${i}" role="button" tabindex="0" aria-label="${esc(lab)}" style="cursor:pointer"><title>${esc(lab)}</title><rect x="${i * bw}" y="0" width="${bw}" height="${base}" fill="transparent"/>${h ? `<path d="M${x},${base}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${base}Z" fill="${on ? '#7b3fc4' : '#b9a6d9'}"/>` : ''}</g>`; }).join('');
  const ticks = [0, 4, 8, 12, 16].map(i => `<text x="${Math.min(W - 2, Math.max(2, i * bw + (i === 16 ? bw / 2 : 0)))}" y="${H - 4}" font-size="10.5" fill="#837e93" text-anchor="${i === 0 ? 'start' : i === 16 ? 'end' : 'middle'}">${i === 16 ? '$80k+' : short(i * B).replace('$0', '$0')}</text>`).join('');
  const dentro = todos().filter(a => a.precio >= lo && a.precio <= hi).length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:100%" role="group" aria-label="Cuántas rentas hay en cada rango de precio">${bars}<line x1="0" x2="${W}" y1="${base + .5}" y2="${base + .5}" stroke="#e4e0ec"/>${ticks}</svg>
    <p class="note" style="margin:2px 0 0">${dentro} de ${todos().length} rentas en tu rango. Toca una barra para elegir ese rango.</p>`;
}

  const fuentes = [...new Set(todos().map(a => a.fuente).filter(Boolean))].sort();
  modal('Filtros', `
    <div class="fld" id="fl-precio"><span class="lab">Presupuesto mensual (MXN)</span><div id="histo" style="margin:4px 0 10px">${histo(f)}</div><div class="row2"><input class="inp num" id="fmin" inputmode="numeric" placeholder="Mínimo" value="${f.min || ''}" aria-label="Mínimo"><input class="inp num" id="fmax" inputmode="numeric" placeholder="Máximo" value="${f.max || ''}" aria-label="Máximo"></div>
      <div class="presets">${[[0, 8000], [8000, 15000], [15000, 25000], [25000, 40000], [40000, 0]].map(([a, b]) => `<button data-a="preset" data-min="${a}" data-max="${b}">${a ? short(a) : 'Hasta'}${a && b ? '–' : a ? ' o más' : ' '}${b ? short(b) : ''}</button>`).join('')}</div></div>
    <div class="fld" id="fl-tipo"><span class="lab">Tipo</span><div class="opts">${Object.entries(TIPOS).map(([k, [l, e]]) => op('tipos', k, ic(e) + l, f.tipos.includes(k))).join('')}</div></div>
    <div class="fld" id="fl-mascotas"><span class="lab">Mascotas</span><div class="opts">${op('mascotas', 'todas', 'Indistinto', f.mascotas === 'todas')}${op('mascotas', 'si', ic('🐾') + 'Solo si dice que acepta', f.mascotas === 'si')}${op('mascotas', 'nono', ic('🐶') + 'Ocultar las que no aceptan', f.mascotas === 'nono')}</div><p class="note" style="margin:6px 0 0">Muchos anuncios no lo dicen; "Ocultar las que no aceptan" deja esos para que preguntes.</p></div>

    `<button class="btn ghost" data-a="ft-limpiar">Limpiar</button><button class="btn main" data-a="ft-ok" style="grid-column:auto">Ver ${n} renta${n === 1 ? '' : 's'}</button>`);
}

function sugerencias(q){
  const n = norm(q); if (n.length < 2) return [];
  const out = [], add = (t, l, sub, d) => out.push({t, l, sub, d});
  for (const a of S.lug.alcaldias) if (norm(a.n).includes(n)) add('alc', a.n, 'Alcaldía', a);
  for (const e of S.lug.estaciones) if (norm(e.n).includes(n)) add('est', e.n, e.t, e);
  for (const c of S.lug.colonias) if (norm(c.n).includes(n)) add('col', c.n, c.a, c);
  for (const a of todos()) if (norm(a.titulo).includes(n)) add('anu', a.titulo, money(a.precio), a);
  const rank = x => (norm(x.l) === n ? -.5 : norm(x.l).startsWith(n) ? 0 : 1) + ({alc: 0, est: .2, col: .4, anu: .6})[x.t] + (x.t === 'est' && x.d.fuera ? 1.5 : 0);
  const cuenta = {}; for (const a of todos()) { const k = norm(a.colonia) + '|' + a.alcaldia; cuenta[k] = (cuenta[k] || 0) + 1; }
  const nAnu = x => x.t === 'col' ? cuenta[norm(x.l) + '|' + x.sub] || 0 : 0;  /* entre homónimos, primero la colonia con rentas */
  return out.sort((a, b) => rank(a) - rank(b) || nAnu(b) - nAnu(a)).slice(0, 12);
}

    if (S.f.alcaldias.length && mapReady) { const ps = S.lug.alcaldias.filter(x => S.f.alcaldias.includes(x.n)).flatMap(x => x.p.flat(2)); const b = ps.reduce((m, [x, y]) => [Math.min(m[0], x), Math.min(m[1], y), Math.max(m[2], x), Math.max(m[3], y)], [180, 90, -180, -90]); map.fitBounds([[b[0], b[1]], [b[2], b[3]]], {padding: pad()}); } }
  else if (a === 'plataformas') abrirPlataformas();
  else if (a === '3d') { const on = el.getAttribute('aria-pressed') !== 'true'; el.setAttribute('aria-pressed', on); map.easeTo({pitch: on ? 58 : 0, bearing: on ? -17 : 0, zoom: on ? Math.max(map.getZoom(), 15.2) : map.getZoom(), duration: 900}); }
  else if (a === 'metro') { const on = el.getAttribute('aria-pressed') !== 'true'; el.setAttribute('aria-pressed', on); for (const l of ['est-c', 'est-l']) map.setLayoutProperty(l, 'visibility', on ? 'visible' : 'none'); }
  else if (a === 'cdmx') map.fitBounds([[-99.33, 19.18], [-98.97, 19.57]], {padding: pad()});
  else if (a === 'sug') irA(SUG[Number(el.dataset.i)]);
  else if (a === 'acerca') acerca();
  else if (a === 'agregar') abrirAgregar();
  else if (a === 'editar') { const x = S.mios.find(t => t.id === id); if (x) abrirAgregar(x); }
  else if (a === 'borrar') { if (el.dataset.ok !== '1') { el.dataset.ok = '1'; el.textContent = '¿Seguro? Toca otra vez'; return; } const x = S.mios.find(t => t.id === id); try { await S.db.collection('mios').doc(x.docId).delete(); cerrarDetalle(); toast('Anuncio borrado.'); } catch (_) { toast('No se pudo borrar.'); } }
  else if (a === 'dr') { leerDraft(); const k = el.dataset.k, v = el.dataset.v, d = S.draft; const val = ['recamaras', 'banos', 'estacionamientos'].includes(k) ? Number(v) : v; d[k] = String(d[k]) === String(val) && k !== 'tipo' && k !== 'mascotas' ? null : val; const sc = document.querySelector('.modal').scrollTop; pintarAgregar(); document.querySelector('.modal').scrollTop = sc; }
  else if (a === 'd-pick') elegirPunto();
  else if (a === 'pick-ok') finPunto(true);
  else if (a === 'pick-no') finPunto(false);
  else if (a === 'd-guardar') guardarDraft();
  else if (a === 'ai-llenar') llenarConIA();
  else if (a === 'd-col-op') { leerDraft(); const c = S.lug.colonias[Number(el.dataset.i)]; const d = S.draft; if (!c || !d) return; enColonia(d, c); pintarAgregar(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.picking) finPunto(false); else if (mroot.firstChild) cerrarModal(); else if (S.vista === 'detalle') cerrarDetalle(); }
  if (e.key === 'Enter' && e.target.classList.contains('card')) abrir(e.target.dataset.id);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.a === 'hbin') { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles: true})); }
  if (e.target.id === 'q') { if (e.key === 'ArrowDown') { sugI = Math.min(SUG.length - 1, sugI + 1); pintarSug(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sugI = Math.max(0, sugI - 1); pintarSug(); e.preventDefault(); } else if (e.key === 'Enter' && SUG.length) { irA(SUG[Math.max(0, sugI)]); e.preventDefault(); } }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { SUG = sugerencias(e.target.value); sugI = -1; pintarSug(); }
  else if ((e.target.id === 'fmin' || e.target.id === 'fmax') && FT) { leerPrecio(); const h = $('#histo'); if (h) h.innerHTML = histo(FT); const b = document.querySelector('[data-a="ft-ok"]'); if (b) { const n = todos().filter(a => pasa(a, FT)).length; b.textContent = 'Ver ' + n + ' renta' + (n === 1 ? '' : 's'); } }
  else if (e.target.id === 'd-col') { const n = norm(limpiarColonia(e.target.value)[0]), el = $('#d-sug'); if (n.length < 2) { el.hidden = true; return; } const r = S.lug.colonias.map((c, i) => [c, i]).filter(([c]) => norm(c.n).includes(n)).sort((a, b) => (norm(a[0].n).startsWith(n) ? 0 : 1) - (norm(b[0].n).startsWith(n) ? 0 : 1)).slice(0, 8); el.hidden = !r.length; el.innerHTML = r.map(([c, i]) => `<button data-a="d-col-op" data-i="${i}">${ic('📍')}<span>${esc(c.n)}</span><small>${esc(c.a)}</small></button>`).join(''); }
});
let notaT;
document.addEventListener('change', async e => {
  if (e.target.id === 'orden') { S.orden = e.target.value; ls.set('bn.orden', S.orden); lista(); }
  else if (e.target.id === 'vis') { S.visible = e.target.checked; ls.set('bn.visible', S.visible); lista(); }
  else if (e.target.id === 'nota') { setEstado(e.target.dataset.id, {nota: e.target.value.slice(0, 2000)}, false); toast('Nota guardada.'); }
  else if (e.target.id === 'd-fotos') { leerDraft(); for (const f of [...e.target.files].slice(0, 8)) { try { const b = await achicar(f, 1600); S.draft.nuevas.push({blob: b, url: URL.createObjectURL(b)}); } catch (_) { toast('Una imagen no se pudo leer.'); } } pintarAgregar(); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'q' && e.target.value) { SUG = sugerencias(e.target.value); pintarSug(); } });
document.addEventListener('focusout', e => { if (e.target.id === 'q') setTimeout(() => { if (!document.activeElement || !document.activeElement.closest('#sug')) { SUG = []; pintarSug(); } }, 150); });

function acerca(){
  const por = {}; S.anuncios.forEach(a => por[a.fuente] = (por[a.fuente] || 0) + 1);
  modal('Sobre los datos', `<p style="margin-top:0">Los <b>${S.anuncios.length} anuncios</b> del mapa se buscaron en internet el ${esc(S.meta.fecha)} y cada uno se revisó contra lo que muestra el buscador. Cada uno lleva a su anuncio original, donde están las fotos y el contacto.</p>
    <ul style="padding-left:18px;color:var(--fg-2)">${Object.entries(por).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<li>${esc(FUENTES[k] ? FUENTES[k].n : k)}: ${v}</li>`).join('')}</ul>
    <div class="warnbox">Pueden haberse rentado ya, y el pin está en el centro de la colonia, no en la dirección exacta. Confirma siempre con el anunciante y nunca pagues antes de ver el lugar.</div>
    <p class="note">Facebook Marketplace y los portales bloquean que una app lea sus anuncios automáticamente, así que no se copian de ahí. Para lo más reciente usa "Buscar en otras plataformas" y agrega aquí lo que te guste con una captura.</p>
    <p class="note">Mapa: OpenFreeMap, OpenMapTiles y © colaboradores de OpenStreetMap. Íconos: OpenMoji (CC BY-SA 4.0).</p>`);
}

/* ============ arranque ============ */
async function cargarAnuncios(){
  try { const d = await getJSON('data/anuncios.json'); S.meta = d && typeof d.meta === 'object' && d.meta || {};
    S.anuncios = (Array.isArray(d && d.anuncios) ? d.anuncios : []).map(a => { try { return prep(a, false); } catch (_) { return null; } }).filter(Boolean); S.errDatos = false; }
  catch (e) { S.anuncios = []; S.errDatos = true; }
  render();
}
async function boot(){
  ojify(document); chips();
  let style;
  setTimeout(() => { if (!mapReady && $('#loading')) $('#loading').innerHTML = '<div>El mapa tarda en cargar… revisa tu conexión.</div>'; }, 20000);
  try { [style, S.lug] = await Promise.all([getJSON('map/style.json'), getJSON('data/lugares.json')]); }
  catch (e) { $('#loading').innerHTML = '<div>No se pudo cargar el mapa. Recarga la página.</div>'; return; }
  for (const e of S.lug.estaciones) e.fuera = !alcaldiaDe(e.lon, e.lat);  /* estaciones del Edomex van al final de la búsqueda */
  style.sprite = BASE + 's/ofm';
  map = new maplibregl.Map({container: 'map', style, center: [-99.165, 19.395], zoom: 11.6, minZoom: 9.5, maxZoom: 18.5, maxBounds: [[-99.75, 18.85], [-98.55, 19.85]], attributionControl: {compact: true}, dragRotate: true, pitchWithRotate: true});
  map.addControl(new maplibregl.NavigationControl({showCompass: true, visualizePitch: true}), 'bottom-right');
  map.on('load', () => { capas(); mapReady = true; try { render(); } finally { const l = $('#loading'); if (l) { l.style.opacity = 0; setTimeout(() => l.remove(), 350); } } });
  map.on('moveend', e => { if (e.restaurar || S.restaurando) return; clearTimeout(S.mt); S.mt = setTimeout(() => { if (S.vista === 'lista' && S.visible) lista(); }, 120); });
  S.estado = ls.get('bn.estado') || {};
  await cargarAnuncios();
  const c = window.claude; if (!c || !c.use) return;
  c.use('sample').then(async ai => { S.ai = ai; try { const lim = ai && await ai.limits(); S.aiImg = !!(lim && lim.images); } catch (_) {} }).catch(() => {});
  c.use('assets').then(a => { S.assets = a; }).catch(() => {});
  c.use('user').then(async u => { if (u && (await u.can('data.write')) === false) S.readOnly = true; }).catch(() => {});
  const db = await c.use('db').catch(() => null); if (!db) return;
  S.db = db;
  /* un documento mal formado se salta; nunca tumba la app */
  db.collection('mios').onSnapshot(s => { S.mios = s.docs.map(d => { try { const v = d.data() || {}; return prep({...v, id: 'm-' + d.id, docId: d.id}, true); } catch (_) { return null; } }).filter(Boolean); if (document.activeElement && document.activeElement.id === 'nota') { chips(); pintarMapa(); } else render(); }, () => {});
  db.collection('estado').onSnapshot(s => { const m = {}; s.docs.forEach(d => { const v = d.data() || {}; if (typeof v.id === 'string') m[v.id] = {fav: !!v.fav, st: typeof v.st === 'string' ? v.st : '', nota: typeof v.nota === 'string' ? v.nota : '', oculto: !!v.oculto, t: Number(v.t) || 0}; }); S.estado = mezclar(m);
    /* si se está escribiendo una nota, no se reconstruye el detalle (se perdería el texto y el teclado) */
    if (document.activeElement && document.activeElement.id === 'nota') { chips(); pintarMapa(); botonesDetalle(); } else render(); }, () => {});
  setTimeout(subirPendientes, 3000);
}
boot();
