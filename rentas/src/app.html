<title>Busca Nido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/*MAPLIBRE_CSS*/
</style>
<style>
/* Layout: el mapa 3D ocupa toda la pantalla; encima flotan la barra de búsqueda con chips (arriba), los botones del mapa (derecha)
   y una hoja inferior con la lista y la ficha del lugar. En escritorio la hoja se vuelve un panel a la izquierda.
   Un solo tema claro a propósito: la ciudad en 3D es blanca, como los mapas 3D de Google, y la interfaz la acompaña.
   Azul para acciones y rutas; naranja para los pines de las rentas. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f1f3f4; --surface-3:#e8eaed; --line:#e3e5e8; --line-2:#dadce0;
  --fg:#202124; --fg-2:#5f6368; --fg-3:#80868b;
  --blue:#1a73e8; --blue-ink:#1967d2; --blue-soft:#e8f0fe; --blue-line:#c6dafc;
  --pin:#e8590c; --pin-soft:#fdebdd; --pin-ink:#b4440a;
  --accent:var(--blue); --accent-soft:var(--blue-soft);
  --good:#188038; --good-soft:#e6f4ea; --bad:#c5221f; --bad-soft:#fce8e6; --warn:#8a5a00; --warn-soft:#fef7e0;
  --heart:#d93a63;
  --shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15); --shadow-2:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --display:"Outfit","Roboto",system-ui,sans-serif; --body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --top:env(safe-area-inset-top, 0px); --bot:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.oj{width:1.25em;height:1.25em;vertical-align:-.28em;display:inline-block}
.ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-.22em}
#map{position:fixed;inset:0;background:#eef0f3}
#ui{position:fixed;inset:0;pointer-events:none;padding-left:var(--gl);padding-right:var(--gr)}
#ui>*{pointer-events:auto}

/* barra superior */
.top{position:absolute;left:var(--gl);right:var(--gr);top:calc(10px + var(--top));display:flex;flex-direction:column;gap:10px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.top.abierta{z-index:8}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:4px 4px 4px 14px;min-height:50px;position:relative}
.brand{display:flex;align-items:center;flex:none}
.brand .oj{width:24px;height:24px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;padding:10px 2px;font-size:16px}
.search input::placeholder{color:var(--fg-2)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fg-2)}
.iconbtn:hover{background:var(--surface-2)}
.badge{position:absolute;top:3px;right:3px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font:700 11px/18px var(--body);text-align:center;padding:0 5px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);max-height:min(60vh,420px);overflow:auto;padding:6px}
.sug button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px}
.sug button:hover,.sug button.on{background:var(--surface-2)}
.sug small{color:var(--fg-3);margin-left:auto;font-size:12px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);box-shadow:var(--shadow-2);font:500 14px/1 var(--body);white-space:nowrap;color:#3c4043}
.chip[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue-ink);box-shadow:inset 0 0 0 1px var(--blue-line),var(--shadow-2)}
.chip .oj{width:18px;height:18px}

/* botones flotantes del mapa */
.mapbtns{position:absolute;right:var(--gr);top:calc(126px + var(--top));display:flex;flex-direction:column;gap:10px;z-index:4}
.mapbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-2);display:grid;place-items:center;font:600 14px/1 var(--display);color:var(--fg-2)}
.mapbtn[aria-pressed="true"]{color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue-line),var(--shadow-2)}
.mapbtn .oj{width:24px;height:24px}
.mapbtn .ico,#add .ico{width:22px;height:22px}

/* hoja inferior / panel lateral */
#sheet{position:absolute;left:0;right:0;bottom:0;height:calc(100% - 66px - var(--top));background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -2px 10px rgba(60,64,67,.18);z-index:6;display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek)));transition:transform .32s cubic-bezier(.2,.8,.2,1);--peek:150px;touch-action:none}
#sheet[data-s="mid"]{transform:translateY(48%)}
#sheet[data-s="full"]{transform:translateY(0)}
#sheet.drag{transition:none}
.handle{padding:10px 0 6px;display:grid;place-items:center;cursor:grab;flex:none}
.handle i{width:36px;height:4px;border-radius:2px;background:var(--line-2)}
.sheet-in{flex:1;min-height:0;display:flex;flex-direction:column;padding-left:var(--gl);padding-right:var(--gr)}
.lh{display:flex;align-items:center;gap:10px;padding:2px 0 10px;flex:none;flex-wrap:wrap}
.lh h2{margin:0;font:600 21px/1.15 var(--display);letter-spacing:-.01em;flex:1;min-width:160px}
.lh h2 small{display:block;font:400 13px/1.35 var(--body);color:var(--fg-2);margin-top:3px;letter-spacing:0}
.sel{border:1px solid var(--line-2);border-radius:18px;padding:7px 12px;background:var(--surface);font-size:13.5px;font-weight:500;color:#3c4043}
.scroll{flex:1;min-height:0;overflow:auto;touch-action:pan-y;padding-bottom:calc(90px + var(--bot));margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding-left:var(--gl);padding-right:var(--gr)}
@media (max-width:899.98px){ /* en el teléfono el arrastre de la hoja lo maneja el JS; el panel de escritorio se recorre normal */
#sheet:not([data-s="full"]) .scroll{touch-action:none}
#sheet[data-s="full"].arriba .scroll{touch-action:pan-down}
#sheet:not([data-s="full"]) .gal,#sheet:not([data-s="full"]) .pills{touch-action:pan-x}
#sheet[data-s="full"].arriba .gal,#sheet[data-s="full"].arriba .pills{touch-action:pan-x pan-down}
}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--fg-2)}
.toggle input{accent-color:var(--blue);width:18px;height:18px}

/* tarjetas de la lista */
.card{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:14px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left;align-items:start;position:relative}
.card:first-child{border-top:0}
.card.on::before{content:"";position:absolute;inset:4px -10px;border-radius:16px;background:var(--blue-soft);z-index:-1}
.thumb{width:92px;height:92px;border-radius:14px;display:grid;place-items:center;overflow:hidden;position:relative;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .oj{width:40px;height:40px;margin-bottom:12px}
.thumb .src{position:absolute;left:0;right:0;bottom:0;color:#fff;font:600 10.5px/1.1 var(--body);padding:5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.price{font:600 20px/1.1 var(--display);letter-spacing:-.01em}
.price small{font:400 12.5px var(--body);color:var(--fg-2)}
.mant{font-size:12.5px;color:var(--fg-2)}
.ttl{font-weight:500;font-size:14.5px;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.where{font-size:13px;color:var(--fg-2);margin-top:3px}
.facts{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:6px;font-size:13px;color:var(--fg-2)}
.facts .oj{width:16px;height:16px;vertical-align:-.22em;margin-right:3px}
.pet{display:inline-flex;align-items:center;gap:3px;font-weight:500;font-size:12px;padding:2px 8px;border-radius:999px}
.pet.si{background:var(--good-soft);color:var(--good)} .pet.no{background:var(--bad-soft);color:var(--bad)} .pet.nd{background:var(--surface-2);color:var(--fg-2)}
.st{display:inline-block;font-weight:500;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink);margin-top:6px}
.fav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:21px;color:var(--fg-2);background:var(--surface)}
.card .fav{position:absolute;right:6px;top:20px;width:32px;height:32px;font-size:18px;box-shadow:var(--shadow-2)}
.fav[aria-pressed="true"]{color:var(--heart)}
.more{width:100%;padding:14px;font-weight:500;color:var(--blue-ink)}
.empty{text-align:center;color:var(--fg-2);padding:26px 10px}
.empty .oj{width:56px;height:56px;display:block;margin:0 auto 8px}

/* ficha del lugar (como la de Google Maps) */
.det-top{display:flex;align-items:flex-start;gap:8px;flex:none;padding-bottom:4px}
.det-top .back{margin-left:-6px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:500;color:var(--blue-ink);padding:6px 6px;border-radius:18px}
.back:hover{background:var(--blue-soft)}
.dttl{font:600 22px/1.2 var(--display);letter-spacing:-.01em;margin:2px 0 4px;text-wrap:balance}
.dprice{font:600 18px/1.2 var(--display)}
.dprice small{font:400 14px var(--body);color:var(--fg-2)}
.dmeta{color:var(--fg-2);font-size:14px;margin-top:2px}
.dwhere{color:var(--fg-2);font-size:14px;margin-top:2px}
.dwhere b{color:var(--pin-ink);font-weight:500}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px calc(-1 * var(--gr)) 4px calc(-1 * var(--gl));padding:2px var(--gr) 6px var(--gl)}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--line-2);background:var(--surface);color:var(--blue-ink);font:500 14px/1 var(--body);text-decoration:none;white-space:nowrap}
.pill.azul{background:var(--blue);border-color:var(--blue);color:#fff}
.pill[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue-line)}
.pill.fav[aria-pressed="true"]{color:var(--heart);background:#fdecf1;border-color:#f5c2d1}
.pill .ico{width:18px;height:18px}
.sec{border-top:1px solid var(--line);padding:14px 0;margin:0}
.sec h3{margin:0 0 8px;font:600 15px var(--display)}
.ruta{display:flex;gap:12px;align-items:flex-start}
.ruta .ri{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.ruta b{font-weight:500}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;margin:12px 0 4px}
.gal img{height:200px;width:auto;max-width:100%;border-radius:14px;scroll-snap-align:start;object-fit:cover;flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fact{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--fg-2)}
.fact b{display:block;font:600 16px/1.2 var(--display);color:var(--fg)}
.box{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px}
.box h3{margin:0 0 6px;font:600 14px var(--display)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:20px;font-weight:500;font-size:14.5px;background:var(--surface-2);color:var(--fg);text-decoration:none;text-align:center}
.btn.main{background:var(--blue);color:#fff;grid-column:1/-1}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--blue-ink)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn .oj{width:20px;height:20px}
.btn:disabled{opacity:.5}
.pipe{display:flex;flex-wrap:wrap;gap:6px}
.pipe button{padding:7px 12px;border-radius:16px;border:1px solid var(--line-2);font-size:13.5px;font-weight:500;color:#3c4043}
.pipe button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
textarea,.inp{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface);outline:0;resize:vertical}
textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.note{font-size:12.5px;color:var(--fg-3)}
.warnbox{background:var(--warn-soft);color:#5c3c00;border-radius:14px;padding:10px 12px;font-size:13px;margin:10px 0}

/* pin de la renta elegida (marcador HTML encima del mapa 3D) */
.pinsel{pointer-events:none}
.pinsel .in{display:flex;flex-direction:column;align-items:center;animation:soltar .6s cubic-bezier(.25,1.45,.5,1) both;position:relative}
.pinsel .lbl{background:var(--fg);color:#fff;font:600 13.5px/1 var(--display);padding:7px 11px;border-radius:999px;margin-bottom:5px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
.pinsel svg{display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.28))}
.pinsel .pulso{position:absolute;bottom:-7px;left:50%;width:26px;height:10px;margin-left:-13px;border-radius:50%;background:rgba(232,89,12,.45);animation:pulso 2s ease-out .5s infinite;z-index:-1}
@keyframes soltar{0%{transform:translateY(-46px) scale(.6);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes pulso{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}

/* botón agregar */
body.det #add{display:none}
body.pick #add,body.pick #chips,body.pick .mapbtns,body.pick #sheet{display:none!important}
body[data-sheet="mid"] #add,body[data-sheet="full"] #add{bottom:calc(18px + var(--bot))}
@media (min-width:900px){ body #add{display:flex!important} }
#add{position:absolute;right:var(--gr);bottom:calc(var(--peek, 150px) + 14px + var(--bot));z-index:7;display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border-radius:18px;background:var(--blue);color:#fff;font:500 15px/1 var(--body);box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}

/* modales */
.veil{position:fixed;inset:0;background:rgba(32,33,36,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:16px var(--gr) calc(20px + var(--bot)) var(--gl);box-shadow:var(--shadow)}
@media (min-width:700px){ .veil{align-items:center} .modal{border-radius:28px;max-height:88%;padding:20px 24px} }
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mh h2{margin:0;font:600 22px/1.15 var(--display)}
.x{width:38px;height:38px;border-radius:50%;background:var(--surface-2);font-size:16px;flex:none}
.fld{margin:16px 0}
.fld>label,.fld>.lab{display:block;font:500 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line-2);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:#3c4043}
.opt[aria-pressed="true"]{border-color:var(--blue-line);background:var(--blue-soft);color:var(--blue-ink)}
.opt .oj{width:18px;height:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{font-size:13px;padding:6px 11px;border-radius:16px;background:var(--surface-2);font-weight:500}
.mfoot{position:sticky;bottom:calc(-20px - var(--bot));background:var(--surface);padding:12px 0 4px;display:flex;gap:8px;margin-top:10px}
.mfoot .btn{flex:1}
.plat{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.plat:first-of-type{border-top:0}
.plat .pn{flex:1;min-width:0}
.plat b{display:block;font-size:15px;font-weight:500}
.plat small{color:var(--fg-2);font-size:12.5px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:700 13px/1 var(--display);color:#fff;flex:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px}

/* modo elegir punto */
.pickbar{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(20px + var(--bot));z-index:9;background:var(--fg);color:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.pickbar span{flex:1;font-weight:500;font-size:14px}
.pickbar .btn{padding:9px 12px}
.cross{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-34px 0 0 -17px;z-index:8;pointer-events:none}
.cross .oj{width:34px;height:34px}

#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(130px + var(--top));z-index:30;background:#323232;color:#fff;padding:12px 16px;border-radius:12px;font-weight:500;font-size:14px;max-width:min(92vw,440px);box-shadow:var(--shadow);text-align:center}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:#eef0f3;font:600 18px var(--display);color:var(--fg);transition:opacity .4s}
.loading div{display:flex;flex-direction:column;align-items:center;gap:12px}
.loading .oj{width:64px;height:64px}
.maplibregl-ctrl-attrib{font-size:10.5px}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--peek,150px) - 4px)}
.maplibregl-ctrl-group{border-radius:22px!important;box-shadow:var(--shadow-2)!important;overflow:hidden}

@media (min-width:900px){
  .top{left:20px;right:auto;width:420px}
  #sheet{left:20px;right:auto;top:calc(132px + var(--top));bottom:20px;height:auto;width:420px;border-radius:24px;transform:none!important;box-shadow:var(--shadow)}
  .handle{display:none}
  .sheet-in{padding:16px 18px 0}
  .scroll{margin:0 -18px;padding:0 18px 20px}
  .pills{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
  #add{bottom:24px;right:24px}
  .mapbtns{top:20px;right:20px}
  .maplibregl-ctrl-bottom-right{bottom:0}
  #toast{top:24px}
}
@media (prefers-reduced-motion:reduce){ #sheet{transition:none} .pinsel .in,.pinsel .pulso{animation:none} }
</style>

<div id="map" role="region" aria-label="Mapa de rentas de la Ciudad de México"></div>
<div id="ui">
  <div class="top">
    <div class="search">
      <span class="brand" aria-hidden="true" data-e="🏘"></span>
      <input id="q" type="search" autocomplete="off" placeholder="Busca colonia, alcaldía o metro" aria-label="Buscar colonia, alcaldía o estación de metro">
      <button class="iconbtn" data-a="filtros" aria-label="Filtros" style="position:relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg><span class="badge" id="nf" hidden></span></button>
      <div class="sug" id="sug" hidden role="listbox"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="mapbtns">
    <button class="mapbtn" data-a="3d" aria-pressed="false" aria-label="Vista 3D">3D</button>
    <button class="mapbtn" data-a="metro" aria-pressed="true" aria-label="Mostrar estaciones de metro" data-ico="train"></button>
    <button class="mapbtn" data-a="plataformas" aria-label="Buscar en otras plataformas" data-ico="link"></button>
    <button class="mapbtn" data-a="cdmx" aria-label="Ver toda la ciudad" data-ico="city"></button>
  </div>

const padDetalle = () => window.innerWidth >= 900 ? {left: 480, top: 80, right: 80, bottom: 80} : {top: 150, bottom: Math.round(window.innerHeight * .5) + 30, left: 46, right: 46};
const azimut = (a, b) => Math.atan2((b.lon - a.lon) * Math.cos(a.lat * Math.PI / 180), b.lat - a.lat) * 180 / Math.PI;
function vuela(c){ if (reducido()) map.jumpTo(c); else map.flyTo({...c, duration: 1900, curve: 1.25, essential: true}); }
/* cámara de la ficha: si hay ruta, la renta abajo y la estación arriba, inclinada; si no, de cerca alrededor del pin */
function camaraDe(a, r){
  if (r) { const c = encuadre(r.coords, azimut(a, r.est), 56); if (c) return c; }
  const off = window.innerWidth >= 900 ? [220, 0] : [0, -Math.round(window.innerHeight * .2)];
  return {center: [a.lon, a.lat], zoom: Math.max(16.6, Math.min(17.3, map.getZoom() + 2.5)), pitch: 60, bearing: map.getBearing() - 22, offset: off};
}
/* encuadre con la cámara inclinada: prueba la cámara sin dibujar (todo en el mismo instante), mide dónde caen los puntos
   en pantalla y ajusta centro y zoom hasta que la ruta llene el hueco que deja la ficha */
function encuadre(pts, bearing, pitch){
  const pad = padDetalle(), cv = map.getCanvas(), W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return null;
  const aw = W - pad.left - pad.right, ah = H - pad.top - pad.bottom; if (aw < 80 || ah < 80) return null;
  const b = pts.reduce((m, [x, y]) => [Math.min(m[0], x), Math.min(m[1], y), Math.max(m[2], x), Math.max(m[3], y)], [180, 90, -180, -90]);
  const c0 = map.cameraForBounds([[b[0], b[1]], [b[2], b[3]]], {padding: pad, bearing}); if (!c0) return null;
  const orig = {center: map.getCenter(), zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing()};
  let center = c0.center, z = Math.min(17.2, c0.zoom + .8);
  S.restaurando = true;
  try {
    for (let i = 0; i < 12; i++) {
      map.jumpTo({center, zoom: z, pitch, bearing});
      const ps = pts.map(p => map.project(p)), xs = ps.map(p => p.x), ys = ps.map(p => p.y);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      center = map.unproject([W / 2 + (x0 + x1) / 2 - (pad.left + aw / 2), H / 2 + (y0 + y1) / 2 - (pad.top + ah / 2)]);
      const f = Math.min(aw / Math.max(1, x1 - x0), ah / Math.max(1, y1 - y0));
      if (i && f >= 1 && f < 1.2) break;
      const nz = Math.max(14.8, Math.min(17.2, z + Math.log2(f) * .85)); if (Math.abs(nz - z) < .02 && f >= 1) break; z = nz;
    }
  } finally { map.jumpTo(orig); S.restaurando = false; }
  return {center, zoom: z, pitch, bearing};
}

  const tok = S.tok = (S.tok || 0) + 1;

/* ============ hoja inferior arrastrable (teléfono) ============ */
const sheet = $('#sheet');
function setSheet(s){ sheet.dataset.s = s; document.body.dataset.sheet = s; }
sheet.addEventListener('scroll', e => { if (e.target.classList && e.target.classList.contains('scroll')) arriba(); }, true);
(function(){ /* el arrastre empieza solo cuando el dedo se mueve: así los toques en botones siguen funcionando */
  let st = null;
  const H = () => sheet.getBoundingClientRect().height, pos = s => s === 'full' ? 0 : s === 'mid' ? H() * .48 : H() - 150;
  sheet.addEventListener('pointerdown', e => { if (window.innerWidth >= 900 || e.button > 0) return; if (e.target.closest('textarea,input:not([type=checkbox])')) return;
    st = {y: e.clientY, x: e.clientX, start: sheet.dataset.s, t0: pos(sheet.dataset.s), h: H(), id: e.pointerId, on: false, sc: e.target.closest('.scroll'), handle: !!e.target.closest('.handle')}; });
  window.addEventListener('pointermove', e => { if (!st || e.pointerId !== st.id) return; st.ly = e.clientY; const dy = e.clientY - st.y;
    if (!st.on) {
      if (Math.abs(dy) < 8 || Math.abs(dy) < Math.abs(e.clientX - st.x)) return;
      /* dentro de la lista en pantalla completa, el gesto es desplazar la lista, salvo que esté arriba y se jale hacia abajo */
      if (!st.handle && st.sc && st.start === 'full' && !(st.sc.scrollTop <= 0 && dy > 0)) { st = null; return; }
      st.on = true; sheet.classList.add('drag'); try { sheet.setPointerCapture(st.id); } catch (_) {} }
    sheet.style.transform = `translateY(${Math.min(st.h - 150, Math.max(0, st.t0 + dy))}px)`; e.preventDefault(); }, {passive: false});
  const up = e => { if (!st || e.pointerId !== st.id) return; const s0 = st; st = null; if (!s0.on) return;
    sheet.classList.remove('drag'); sheet.style.transform = ''; try { sheet.releasePointerCapture(s0.id); } catch (_) {}
    /* pointercancel llega sin coordenadas (clientY 0): se usa la última posición conocida para no invertir el gesto */
    const y = e.type === 'pointercancel' ? (s0.ly ?? s0.y) : e.clientY, dy = y - s0.y, t = s0.t0 + dy, hh = H(), opts = [['full', 0], ['mid', hh * .48], ['peek', hh - 150]];
    let best = opts.reduce((a, b) => Math.abs(b[1] - t) < Math.abs(a[1] - t) ? b : a)[0];
    if (Math.abs(dy) > 60) { const i = ['full', 'mid', 'peek'].indexOf(s0.start); best = ['full', 'mid', 'peek'][Math.max(0, Math.min(2, i + (dy > 0 ? 1 : -1)))]; }
    setSheet(best); sheet.dataset.justDragged = '1'; setTimeout(() => delete sheet.dataset.justDragged, 60); };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  sheet.addEventListener('click', e => {
    if (sheet.dataset.justDragged) { e.stopPropagation(); e.preventDefault(); return; }
    if (window.innerWidth >= 900) return;
    if (e.target.closest('.handle')) { const s = sheet.dataset.s; setSheet(s === 'peek' ? 'mid' : s === 'mid' ? 'full' : 'mid'); return; }
    if (sheet.dataset.s === 'peek' && !e.target.closest('button,a,input,select,textarea,label,.card')) setSheet('mid');
  }, true);
})();

/* distribución de rentas por precio: barras moradas = dentro del presupuesto elegido */

    return `<g data-a="hbin" data-i="${i}" role="button" tabindex="0" aria-label="${esc(lab)}" style="cursor:pointer"><title>${esc(lab)}</title><rect x="${i * bw}" y="0" width="${bw}" height="${base}" fill="transparent"/>${h ? `<path d="M${x},${base}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${base}Z" fill="${on ? '#7b3fc4' : '#b9a6d9'}"/>` : ''}</g>`; }).join('');
  const ticks = [0, 4, 8, 12, 16].map(i => `<text x="${Math.min(W - 2, Math.max(2, i * bw + (i === 16 ? bw / 2 : 0)))}" y="${H - 4}" font-size="10.5" fill="#837e93" text-anchor="${i === 0 ? 'start' : i === 16 ? 'end' : 'middle'}">${i === 16 ? '$80k+' : short(i * B).replace('$0', '$0')}</text>`).join('');
  const dentro = todos().filter(a => a.precio >= lo && a.precio <= hi).length;

function leerDraft(){ const d = S.draft; if (!d) return; const g = id => $('#' + id); if (!g('d-titulo')) return;
  d.url = g('d-url').value.trim(); d.titulo = g('d-titulo').value.trim(); d.precio = g('d-precio').value; d.mantenimiento = g('d-mant').value; d.m2 = g('d-m2').value; d.contacto = g('d-contacto').value.trim(); d.notas = g('d-notas').value.trim(); if (g('d-col').value.trim() !== d.colonia) { d.colonia = g('d-col').value.trim(); if (d.prec !== 'exacta') { d.lat = d.lon = null; d.alcaldia = ''; } } }
const numero = v => { const n = num(v); return n > 0 ? n : null; };
/* solo devuelve una colonia si no hay duda: mismo nombre (y misma alcaldía si se sabe) o un único nombre que empiece igual.
   Si hay homónimos en otras alcaldías o varias opciones, regresa null y la persona elige de la lista, que muestra la alcaldía. */
function ubicarColonia(nombre, alc){
  const n = norm(nombre), A = alc ? norm(alc) : ''; if (!n) return null;
  const enAlc = l => A ? l.filter(x => norm(x.a) === A || norm(x.a).includes(A) || A.includes(norm(x.a))) : l;
  const ex = enAlc(S.lug.colonias.filter(x => norm(x.n) === n)); if (ex.length === 1) return ex[0]; if (ex.length > 1) return null;
  const pre = enAlc(S.lug.colonias.filter(x => norm(x.n).startsWith(n + ' '))); return pre.length === 1 ? pre[0] : null;
}
/* "Col. Álamos", "Colonia Álamos, Benito Juárez", "Narvarte Poniente, CDMX" → nombre y, si viene, la alcaldía */
function limpiarColonia(s){ const [n, ...r] = String(s || '').split(','), e = r.join(',').trim(); return [n.replace(/^\s*(col\.?|colonia)\s+/i, '').trim(), S.lug.alcaldias.some(a => norm(a.n) === norm(e)) ? e : '']; }
/* centro de la colonia con un pequeño desplazamiento fijo por anuncio, para que dos anuncios de la misma colonia no queden en el mismo punto */
function enColonia(d, c){ const sem = (d.semilla || '') + d.titulo + d.url; d.colonia = c.n; d.alcaldia = c.a; d.lat = c.lat + ((hash(sem) % 200) - 100) / 60000; d.lon = c.lon + ((hash(d.url + sem + 'x') % 200) - 100) / 60000; d.prec = 'colonia'; }
async function achicar(file, max){ /* reduce la imagen antes de subirla */
  const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return new Promise(ok => c.toBlob(b => ok(b), 'image/jpeg', .82));
}
async function guardarDraft(){
  leerDraft(); const d = S.draft, err = m => { const e = $('#d-err'); e.textContent = m; e.hidden = false; };
  const precio = numero(d.precio); if (!precio) return err('Escribe la renta mensual.');
  if (!d.lat) { const [nc, alcTxt] = limpiarColonia(d.colonia), c = ubicarColonia(nc, d.alcaldia || alcTxt); if (c) enColonia(d, c); }
  if (!d.lat) { if (d.colonia && $('#d-col')) $('#d-col').dispatchEvent(new Event('input', {bubbles: true})); return err('Elige la colonia de la lista o marca el punto en el mapa.'); }
  const url = normUrl(d.url); if (d.url && !url) return err('La liga no parece válida; cópiala completa desde el navegador.');
  const btn = document.querySelector('[data-a="d-guardar"]'); if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  const fotos = d.fotos.slice();
  for (const f of d.nuevas) { try { const r = await S.assets.upload(f.blob, {type: 'image/jpeg'}); fotos.push(r.id); } catch (e) { toast('Una foto no se pudo subir.'); } }
  const tipo = tieneTipo(d.tipo) ? d.tipo : 'otro';
  const doc = {titulo: d.titulo || (TIPOS[tipo][0] + ' en ' + d.colonia), url, fuente: url ? fuenteDe(url) : '', tipo, precio, mantenimiento: numero(d.mantenimiento), colonia: d.colonia, alcaldia: d.alcaldia || alcaldiaDe(d.lon, d.lat) || '', calle: d.calle || null,
    recamaras: numero(d.recamaras), banos: numero(d.banos), m2: numero(d.m2), estacionamientos: num(d.estacionamientos), amueblado: typeof d.amueblado === 'boolean' ? d.amueblado : null, mascotas: ['si', 'no'].includes(d.mascotas) ? d.mascotas : 'no_dice', contacto: d.contacto, requisitos: d.notas || null, lat: d.lat, lon: d.lon, prec: d.prec, fotos, creado: d.creado || new Date().toISOString()};
  const id = d.editId || ('m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  try { await S.db.collection('mios').doc(id).set(doc); } catch (e) { if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; } return err(e && e.code === 'invalid_argument' ? 'No tienes permiso para guardar aquí.' : 'No se pudo guardar. Revisa tu conexión.'); }
  cerrarModal(); toast(d.editId ? 'Cambios guardados.' : 'Anuncio agregado al mapa.');
  setTimeout(() => abrir('m-' + id), 400);
}
async function llenarConIA(){
  leerDraft(); const files = [...($('#ai-img')?.files || [])].slice(0, 4), txt = ($('#ai-txt')?.value || '').trim();
  if (!files.length && !txt) return toast('Sube una captura o pega el texto del anuncio.');
  const b = document.querySelector('[data-a="ai-llenar"]'); if (b) { b.disabled = true; b.textContent = 'Leyendo el anuncio…'; }
  const draft = S.draft, antes = JSON.parse(JSON.stringify({...S.draft, nuevas: []}));
  try {
    const imgs = []; for (const f of files) imgs.push(await achicar(f, 1400));  /* se agregan como fotos solo si la lectura sale bien */
    const r = await S.ai.json(`Eres asistente para buscar renta en la Ciudad de México. ${imgs.length ? 'Te paso capturas de pantalla de un anuncio' : 'Te paso el texto de un anuncio'} de renta. Extrae SOLO lo que diga el anuncio; lo que no diga, ponlo en null. Responde únicamente un objeto JSON con: {"titulo": texto corto, "precio": número mensual en pesos, "mantenimiento": número o null, "tipo": "departamento"|"casa"|"cuarto"|"loft"|"estudio"|"otro", "colonia": nombre de la colonia, "alcaldia": alcaldía de la CDMX si aparece o null, "calle": calle o null, "recamaras": número o null, "banos": número o null, "m2": número o null, "estacionamientos": número o null, "amueblado": true|false|null, "mascotas": "si"|"no"|"no_dice", "contacto": teléfono, WhatsApp o nombre tal como aparece, o null, "url": liga si aparece o null, "notas": requisitos y datos útiles en una línea}.${txt ? '\n\nTexto del anuncio:\n' + txt.slice(0, 6000) : ''}`, imgs.length ? {images: imgs} : {});
    if (S.draft !== draft) return;  /* se cerró (o se abrió otro) mientras leía */
    leerDraft(); const d = S.draft, x = r && typeof r === 'object' ? r : {};
    /* lo que la persona escribió mientras Claude leía se respeta */
    const libre = k => String(d[k] ?? '') === String(antes[k] ?? '');
    const set = (k, v) => { if (v !== null && v !== undefined && v !== '' && libre(k)) d[k] = v; };
    for (const k of ['titulo', 'colonia', 'calle', 'contacto', 'notas']) if (typeof x[k] === 'string') set(k, x[k].trim().slice(0, k === 'notas' ? 600 : 120));
    for (const k of ['precio', 'mantenimiento', 'recamaras', 'banos', 'm2']) { const v = num(x[k]); if (v > 0) set(k, v); }  /* número o texto numérico; nunca HTML */
    { const v = num(x.estacionamientos); if (v !== null) set('estacionamientos', v); }
    if (typeof x.amueblado === 'boolean') set('amueblado', x.amueblado);
    if (normUrl(x.url)) set('url', normUrl(x.url));
    if (tieneTipo(x.tipo) && libre('tipo')) d.tipo = x.tipo;
    if (['si', 'no', 'no_dice'].includes(x.mascotas) && libre('mascotas')) d.mascotas = x.mascotas;
    if (d.colonia !== antes.colonia && !(d.lat && d.lat !== antes.lat)) {  /* si la persona eligió colonia mientras leía, se respeta */
      const [nc, alcTxt] = limpiarColonia(d.colonia), c = ubicarColonia(nc, typeof x.alcaldia === 'string' && x.alcaldia ? x.alcaldia : alcTxt);
      /* un punto marcado a mano se conserva si la colonia nueva queda cerca; si queda lejos, se mueve */
      const lejos = d.prec === 'exacta' && d.lat && (!c || hav({lat: d.lat, lon: d.lon}, c) > 1000);
      if (d.prec !== 'exacta' || lejos) { if (c) enColonia(d, c); else { d.colonia = nc; d.lat = d.lon = null; d.alcaldia = ''; d.prec = 'colonia'; } }  /* sin coincidencia clara: que la elija de la lista */
    }
    if (S.assets) for (const bl of imgs) d.nuevas.push({blob: bl, url: URL.createObjectURL(bl)});
    if (S.picking) return toast('Claude llenó el anuncio; lo verás al tocar Listo.');  /* finPunto() pinta el formulario */
    const act = document.activeElement, fid = act && act.id, val = act && act.value, ss = act && act.selectionStart, se = act && act.selectionEnd;
    pintarAgregar(); const el = fid && $('#' + fid); if (el && el.focus) { if (typeof val === 'string' && el.value === val.trim()) el.value = val; el.focus(); try { el.setSelectionRange(ss, se); } catch (_) {} }
    if (!d.lat && d.colonia) $('#d-col').dispatchEvent(new Event('input', {bubbles: true}));  /* muestra la lista de colonias para elegir */
    toast(d.lat ? 'Listo. Revisa los datos antes de guardar.' : 'Listo. Elige la colonia de la lista para ubicarlo.');
  } catch (e) { if (S.draft !== draft) return; if (b) { b.disabled = false; b.textContent = 'Llenar con Claude'; } toast(e && e.code === 'not_granted' ? 'Hace falta aceptar el permiso de IA de la página.' : 'No pude leer el anuncio. Llénalo a mano.'); }
}
function elegirPunto(){
  if (S.picking) return;
  leerDraft(); const d = S.draft; if (!d) return; mroot.innerHTML = ''; S.picking = true; document.body.classList.add('pick'); SUG = []; pintarSug();
  const ui = $('#ui'); const bar = document.createElement('div'); bar.className = 'pickbar'; bar.innerHTML = `<span>Mueve el mapa hasta que el pin quede sobre la vivienda.</span><button class="btn" data-a="pick-no">Cancelar</button><button class="btn main" data-a="pick-ok" style="grid-column:auto">Listo</button>`;
  const cr = document.createElement('div'); cr.className = 'cross'; cr.innerHTML = ic('📍'); ui.appendChild(bar); document.body.appendChild(cr);
  if (d.lat) map.jumpTo({center: [d.lon, d.lat], zoom: 16}); else if (map.getZoom() < 14) map.easeTo({zoom: 15});

function finPunto(ok){
  S.picking = false; document.body.classList.remove('pick'); (S.pickEls || []).forEach(e => e.remove()); S.pickEls = null;
  if (!S.draft) return;
  if (ok) { const c = map.getCenter(), d = S.draft; d.lat = c.lat; d.lon = c.lng; d.prec = 'exacta'; d.alcaldia = alcaldiaDe(c.lng, c.lat) || d.alcaldia; if (!d.colonia) { let best = null, bd = 1e9; for (const x of S.lug.colonias) { const dd = hav({lat: c.lat, lon: c.lng}, x); if (dd < bd) { bd = dd; best = x; } } if (best) d.colonia = best.n; } }
  pintarAgregar();
}

/* ============ guardar estado (favoritos, avance, notas) ============ */
/* lo que no se pudo subir se guarda aquí y se mezcla con lo de la nube hasta que se logre subir */
const pend = () => ls.get('bn.estado.pend') || {};
/* gana lo más nuevo: si la nube ya trae un cambio posterior, el pendiente local se descarta para no pisarlo después */
function mezclar(m){ const p = pend(); let cambio = false; for (const k in p) { if (!m[k] || (p[k].t || 0) >= (m[k].t || 0)) m[k] = p[k]; else { delete p[k]; cambio = true; } } if (cambio) ls.set('bn.estado.pend', p); return m; }
function quitarPend(id, t){ const p = pend(); if (p[id] && p[id].t === t) { delete p[id]; ls.set('bn.estado.pend', p); } }
async function setEstado(id, patch, pintar = true){
  const cur = Object.assign({}, est(id), patch, {t: Date.now()}); S.estado[id] = cur;
  if (pintar) render(); else pintarMapa();
  if (!S.db) return ls.set('bn.estado', S.estado);
  const p = pend(); p[id] = cur; ls.set('bn.estado.pend', p);  /* se guarda ANTES de intentar: si la base no responde o falla, ya está */
  if (!S.readOnly) { try { await S.db.collection('estado').doc('e-' + hash(id).toString(36)).set({id, ...cur}); quitarPend(id, cur.t); subirPendientes(); return; } catch (e) { if (e && e.code === 'invalid_argument') S.readOnly = true; } }
  const msg = S.readOnly ? 'Sin permiso para guardar en la nube: queda solo en este dispositivo.' : 'No se pudo guardar en la nube; queda en este dispositivo y se reintenta después.';
  setTimeout(() => toast(msg), 0);  /* después del aviso de quien llamó ("Guardado en ♥", "Nota guardada.") */
}
let subiendo = false;
async function subirPendientes(){
  if (!S.db || S.readOnly || subiendo || !S.estadoListo) return; subiendo = true;
  const aTiempo = pr => Promise.race([pr, new Promise((_, no) => setTimeout(() => no(new Error('sin respuesta')), 10000))]);
  try { for (const [id, v] of Object.entries(pend())) { try { await aTiempo(S.db.collection('estado').doc('e-' + hash(id).toString(36)).set({id, ...v})); quitarPend(id, v.t); } catch (e) { if (e && e.code === 'invalid_argument') { S.readOnly = true; break; } } } }
  finally { subiendo = false; }
}
setInterval(() => { if (Object.keys(pend()).length) subirPendientes(); }, 15000); addEventListener('online', () => subirPendientes());

/* ============ búsqueda ============ */
function sugerencias(q){
  const n = norm(q); if (n.length < 2) return [];
  const out = [], add = (t, l, sub, d) => out.push({t, l, sub, d});
  for (const a of S.lug.alcaldias) if (norm(a.n).includes(n)) add('alc', a.n, 'Alcaldía', a);
  for (const e of S.lug.estaciones) if (norm(e.n).includes(n)) add('est', e.n, e.t, e);
  for (const c of S.lug.colonias) if (norm(c.n).includes(n)) add('col', c.n, c.a, c);
  for (const a of todos()) if (norm(a.titulo).includes(n)) add('anu', a.titulo, money(a.precio), a);
  const rank = x => (norm(x.l) === n ? -.5 : norm(x.l).startsWith(n) ? 0 : 1) + ({alc: 0, est: .2, col: .4, anu: .6})[x.t] + (x.t === 'est' && x.d.fuera ? 1.5 : 0);
  const cuenta = {}; for (const a of todos()) { const k = norm(a.colonia) + '|' + a.alcaldia; cuenta[k] = (cuenta[k] || 0) + 1; }
  const nAnu = x => x.t === 'col' ? cuenta[norm(x.l) + '|' + x.sub] || 0 : 0;  /* entre homónimos, primero la colonia con rentas */
  return out.sort((a, b) => rank(a) - rank(b) || nAnu(b) - nAnu(a)).slice(0, 12);
}

    S.meta = typeof d.meta === 'object' && d.meta || {}; let malo = false;
    S.anuncios = d.anuncios.map(a => { try { return prep(a, false); } catch (e) { if (!malo) { malo = true; console.warn('Anuncio descartado', a, e); } return null; } }).filter(Boolean); }
  catch (e) { S.anuncios = []; S.errDatos = true; console.warn('No se pudieron cargar los anuncios', e); }
  finally { clearTimeout(to); S.cargando = false; }
  render();
}
