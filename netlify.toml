# Sitio estático de pronósticos F1 (se genera con f1_austin/publicar_sitio.py).
# Netlify publica la carpeta sitio_f1; el único paso de build arma dentro la página de Liga MX (/ligamx/).
[build]
  publish = "sitio_f1"
  # Cerebro Liga MX: se arma en cada despliegue dentro de sitio_f1/ligamx (no se versiona duplicado)
  command = "python3 ligamx/web/construir.py --documento --salida sitio_f1/ligamx"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
