name: Publicar sitio

# Publica docs/ en GitHub Pages.
# Corre solo en cada push a la rama principal, así que basta con hacer push
# para que el sitio quede actualizado. También se puede lanzar a mano desde la
# pestaña Actions (Run workflow).

on:
  push:
    branches: [claude/new-session-i9lrt6]
    paths:
      - "docs/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no se cancela la que ya va en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true activa Pages si todavía no lo está, sin tener que
      # entrar a Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: despliegue
        uses: actions/deploy-pages@v4
