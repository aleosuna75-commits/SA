# Nuestro Nido en producción. En Netlify: "Base directory" = finanzas.
# El build arma la carpeta web/ a partir de index.html y le conecta Supabase y la función de IA.
[build]
  command = "python3 construir.py"
  publish = "web"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"
