<title>Nuestro Nido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: app de cuentas compartidas, clara y colorida. Cada sección toma un color propio, las formas son redondas y el saldo va en una tarjeta degradada; navegación abajo en el teléfono y arriba en escritorio. */
:root{
  color-scheme:light;
  --violet:#e4487f; --coral:#f2709c; --sun:#d6336c; --mint:#f783ac; --sky:#e64980; --pink:#f06595; --azul:#3b8fe8;
  --bg:#fbe4ea; --surface:#ffffff; --surface-2:#fde3ec; --line:#f8cfdd; --line-2:#f0a9c2;
  --fg:#3b1d2a; --fg-2:#6b4756; --fg-3:#99717f;
  --accent:#e4487f; --accent-ink:#ffffff; --accent-soft:#ffe3ec;
  --oro:#e4487f; --oro-2:#f783ac;
  --hero:#e4487f; --hero-2:rgba(255,255,255,.2); --hero-line:rgba(255,255,255,.25); --hero-fg:#ffffff; --hero-fg-2:rgba(255,255,255,.9);
  --good:#178a52; --good-soft:#dcf5e6; --warn:#a85f00; --warn-soft:#fff0cf; --bad:#c92a2a; --bad-soft:#ffe3e3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s9:#b39aa5;
  --shadow:0 10px 30px rgba(120,30,70,.16);
  --display:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 120px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--hero);color:var(--hero-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;flex:none}
.brand h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;font-size:12.5px;color:var(--fg-3)}
.me{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;max-width:46vw}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.av.sm{width:16px;height:16px;font-size:9px}
.months{display:flex;align-items:center;justify-content:space-between;gap:8px}
.months .mlabel{font-family:var(--display);font-weight:700;font-size:17px}
.months button{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px;color:var(--fg-2)}
.months button:disabled{opacity:.35;cursor:default}

.banner{background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:13.5px;color:var(--fg);display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}

/* rejilla */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){ .grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start} .span2{grid-column:1/-1} }
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-family:var(--display);font-size:16.5px;font-weight:700;margin:0;letter-spacing:-.005em}
.card-h .aside{font-size:13px;color:var(--fg-3)}
.link{color:var(--accent);font-weight:600;font-size:13.5px}
.empty{color:var(--fg-3);font-size:14px;padding:10px 0}

/* tarjeta de saldo */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .lbl{font-size:13px;color:var(--hero-fg-2);font-weight:500}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(38px,11vw,54px);line-height:1;letter-spacing:-.02em;margin-top:4px}
.hero .big small{font-size:.36em;font-weight:500;color:var(--hero-fg-2);letter-spacing:.04em;margin-left:6px}
.hero .delta{font-size:13px;color:var(--hero-fg-2);margin-top:8px}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero-stats div{background:var(--hero-2);border-radius:14px;padding:10px 12px;min-width:0}
.hero-stats span{display:block;font-size:12px;color:var(--hero-fg-2)}
.hero-stats b{font-size:16px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis}

/* captura rápida */
.quick{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.quick:focus-within{border-color:var(--accent)}
.quick input{flex:1;min-width:0;border:0;background:none;outline:0;padding:8px 0;font-size:15px}
.quick input::placeholder{color:var(--fg-3)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:10px 16px;font-size:14.5px;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--fg-3);margin:6px 2px 0}

/* avisos */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500}
.alert.info{background:var(--accent-soft)} .alert.bad{background:var(--bad-soft)} .alert.warn{background:var(--warn-soft)} .alert.good{background:var(--good-soft)}
.alert i{font-style:normal;flex:none}

/* iconos */
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--surface-2);font-size:21px;line-height:1;overflow:hidden}
.ic svg{width:56%;height:56%} .ic img{width:100%;height:100%;object-fit:cover;display:block}
.ic.mono{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:-.02em}
.ic.s{width:30px;height:30px;border-radius:9px;font-size:15px} .ic.s.mono{font-size:8.5px}
.ic.l{width:54px;height:54px;border-radius:16px;font-size:27px} .ic.l.mono{font-size:14px}
.ic.ring{box-shadow:inset 0 0 0 1px var(--line)}

/* filas */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--fg-3);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.row .amt{font-weight:700;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-weight:500;font-size:12px;color:var(--fg-3)}
.amt.in{color:var(--good)}
.due.bad{color:var(--bad);font-weight:600} .due.warn{color:var(--warn);font-weight:600}
.day-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:14px 0 2px}

/* gráficas */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--fg-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed var(--fg-3);border-radius:0;width:14px;vertical-align:3px}
.chart{width:100%;min-height:150px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);font-size:11px;fill:var(--fg-3);font-variant-numeric:tabular-nums}
.chart .endlbl{fill:var(--fg);font-weight:700;font-size:12px}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:150px;flex:none;margin:0 auto}
.donut text.c1{font-family:var(--display);font-weight:700;font-size:17px;fill:var(--fg)}
.donut text.c2{font-size:10.5px;fill:var(--fg-3)}
.cats{flex:1;min-width:200px;display:flex;flex-direction:column;gap:7px}
.cat{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13.5px}
.cat i{width:10px;height:10px;border-radius:3px}
.cat .pc{color:var(--fg-3);font-size:12.5px;width:34px;text-align:right}
.cat b{font-weight:600}
.pbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.pbar>div{height:100%;border-radius:999px;background:var(--accent);min-width:3px}
.pbar.warn>div{background:var(--warn)} .pbar.bad>div{background:var(--bad)} .pbar.good>div{background:var(--good)}
.bud{display:flex;flex-direction:column;gap:5px;padding:8px 0}
.bud .l1{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.bud .l1 b{font-weight:600}
.bud .note{font-size:12.5px;font-weight:600}
.bud .note.bad{color:var(--bad)} .bud .note.warn{color:var(--warn)}
.who-row{display:grid;grid-template-columns:26px minmax(0,90px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.who-row b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* metas */
.goals{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.goal{display:flex;flex-direction:column;gap:12px}
.goal-top{display:flex;gap:12px;align-items:center}
.goal-top .mid{flex:1;min-width:0}
.goal h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .pct{font-family:var(--display);font-weight:700;font-size:22px}
.goal .line{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--fg-2)}
.goal .line b{color:var(--fg)}
.goal .acts{display:flex;gap:8px;flex-wrap:wrap} .goal .line b{text-align:right}

/* filtros */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;outline:0}
.search:focus{border-color:var(--accent)}

/* asesor */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;white-space:normal;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg ul{margin:6px 0;padding-left:18px}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--fg-3);border-radius:12px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;font-weight:500;box-shadow:0 10px 24px rgba(60,40,180,.35)}
@media (min-width:1140px){ .fab{right:calc(50% - 540px)} }

/* hoja */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,8,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:24px 24px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){ .veil{align-items:center} .sheet{border-radius:24px} }
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-family:var(--display);margin:0;font-size:20px;font-weight:700}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;outline:0;min-width:0}
.inp:focus{border-color:var(--accent)}
.money{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 16px}
.money:focus-within{border-color:var(--accent)}
.money span{font-family:var(--display);font-size:28px;font-weight:700;color:var(--fg-3)}
.money input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--display);font-size:32px;font-weight:700;padding:0}
.withic{display:flex;gap:10px;align-items:center}
.withic .inp{flex:1}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.kind{padding:10px 8px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.kind i{font-style:normal;font-size:20px}
.kind[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.banks{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.bank{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:1.5px solid transparent;font-size:11.5px;font-weight:600;color:var(--fg-2)}
.bank[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.sheet-acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet-acts .btn.main{flex:1;padding:13px 16px;font-size:15.5px}

#tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:500;padding:7px 10px;border-radius:10px;white-space:pre-line;max-width:240px;line-height:1.35}
#toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(92vw,440px);display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
#toast.bad{background:var(--bad);color:#fff}
.skel{color:var(--fg-3);text-align:center;padding:60px 0}
@media (prefers-reduced-motion:no-preference){ .pbar>div{transition:width .5s ease} .sheet.in{animation:up .22s ease} @keyframes up{from{transform:translateY(24px)}to{transform:none}} }

/* ---------- estilo vivo: un color por sección, formas redondas y movimiento ---------- */
body{font-size:15.5px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.top{padding-bottom:6px}
.brand{display:block}
.brand h1{font:800 1.75rem/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand h1 b{background:linear-gradient(90deg,var(--violet),var(--pink),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.brand p{font-size:.8rem;margin-top:1px}
.me{border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(228,72,127,.12)}
.months .mlabel{font:800 1.3rem/1 var(--display)}
.months button{border-radius:14px;border:1.5px solid var(--line);color:var(--accent);font-weight:800}
.banner{border-radius:16px;background:#ffe3ec}
.card{--c:var(--violet);border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--c) 22%,#fff);background:color-mix(in srgb,var(--c) 5%,#fff);box-shadow:0 6px 20px color-mix(in srgb,var(--c) 12%,transparent)}
.col>.card:nth-of-type(6n+2),.goals>.card:nth-of-type(6n+2){--c:var(--coral)}
.col>.card:nth-of-type(6n+3),.goals>.card:nth-of-type(6n+3){--c:var(--sky)}
.col>.card:nth-of-type(6n+4),.goals>.card:nth-of-type(6n+4){--c:var(--sun)}
.col>.card:nth-of-type(6n+5),.goals>.card:nth-of-type(6n+5){--c:var(--mint)}
.col>.card:nth-of-type(6n),.goals>.card:nth-of-type(6n){--c:var(--pink)}
.card-h{align-items:center}
.card-h h2{font:800 1.22rem/1.1 var(--display);display:flex;align-items:center;gap:10px}
.card-h h2::before{content:"";flex:none;width:11px;height:11px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
.card-h .aside{font-size:.8rem;font-weight:700}
.link{font-weight:800;font-size:.85rem;color:color-mix(in srgb,var(--c,var(--accent)) 62%,#3b1d2a);white-space:nowrap}
.hero{border-radius:26px;padding:22px 20px 18px;gap:16px;background:linear-gradient(120deg,#d6336c,#e4487f 35%,#f06a9a 70%,#f78fb3);background-size:220% 220%;box-shadow:0 14px 34px rgba(228,72,127,.35);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-46px;top:-56px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-weight:700;font-size:.92rem}
.hero .big{font:800 clamp(2.9rem,14vw,4.2rem)/1 var(--display);letter-spacing:-.02em}
.hero .big small{font:700 .9rem/1 var(--body);letter-spacing:.06em}
.hero-stats div{border-radius:16px}
.hero-stats b{font:800 1.15rem/1.2 var(--display)}
.quick{border-radius:999px;border:1.5px solid var(--line);box-shadow:0 6px 18px rgba(228,72,127,.1);padding-left:16px}
.btn{border-radius:999px;font:800 .9rem/1 var(--body);padding:12px 18px;background:linear-gradient(135deg,var(--violet),#f06a9a);color:#fff;box-shadow:0 6px 14px rgba(228,72,127,.3);transition:transform .12s}
.btn.sm{padding:9px 14px;font-size:.8rem;border-radius:999px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn:active,.chip:active,.kind:active,.tab:active,.bank:active{transform:scale(.95)}
.chip{border:1.5px solid var(--line);font-weight:700;transition:transform .12s,background .15s}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--violet),#f06a9a);border-color:transparent;color:#fff}
.alert{border-radius:16px;font-weight:600}
.alert.info{background:#ffe3ec}
.ic{border-radius:14px} .ic.l{border-radius:18px} .ic.s{border-radius:9px}
.row .amt{font:800 1.1rem/1.1 var(--display)}

const pad = n => String(n).padStart(2,'0');

const ym = d => d.getFullYear()+'-'+pad(d.getMonth()+1);

const addMonths = (m, n) => { const [y,mo] = m.split('-').map(Number); return ym(new Date(y, mo-1+n, 1)); };
const addMonthDate = s => { const d = parseD(s); const day = d.getDate(); const t = new Date(d.getFullYear(), d.getMonth()+1, 1); const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); t.setDate(Math.min(day,last)); return ymd(t); };
const daysIn = m => { const [y,mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };

const OJ = {map: null, url: {}};
const EMO = /\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?)*/gu;
const ojKey = e => e.includes('\u200D') ? e : e.replace(/\uFE0F/g, '');
function ojify(node){
  if (!OJ.map || !node || node.nodeType !== 1) return;
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), list = [];
  while (w.nextNode()) { const t = w.currentNode, par = t.parentNode; EMO.lastIndex = 0;
    if (par && par.namespaceURI === 'http://www.w3.org/1999/xhtml' && !/^(SCRIPT|STYLE|TEXTAREA|TITLE)$/.test(par.nodeName) && EMO.test(t.nodeValue)) list.push(t); }
  for (const t of list) { const txt = t.nodeValue, frag = document.createDocumentFragment(); let last = 0, hit = false, m; EMO.lastIndex = 0;
    while ((m = EMO.exec(txt))) { const k = ojKey(m[0]); if (!OJ.map[k]) continue; hit = true;
      if (m.index > last) frag.append(txt.slice(last, m.index));
      const img = document.createElement('img'); img.className = 'oj'; img.alt = m[0]; img.draggable = false;
      img.src = OJ.url[k] || (OJ.url[k] = URL.createObjectURL(new Blob([OJ.map[k]], {type: 'image/svg+xml'}))); frag.append(img); last = m.index + m[0].length; }
    if (hit) { if (last < txt.length) frag.append(txt.slice(last)); t.replaceWith(frag); } }
}
new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) { if (n.nodeType === 1 && n.className !== 'oj') ojify(n); else if (n.nodeType === 3 && n.parentNode) ojify(n.parentNode); } }).observe(document.body, {childList: true, subtree: true});

function parseQuick(raw){
  const m = raw.match(/(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?\s*(k\b|mil\b)?/i);
  let amount = 0, rest = raw;
  if (m) { amount = parseFloat(m[1].replace(/,/g,'') + (m[2]||'')) * (m[3] ? 1000 : 1); rest = raw.replace(m[0], ' '); }
  rest = rest.replace(/\$|\bpesos\b|\bmxn\b/gi, ' ');
  const n = ' ' + norm(rest) + ' ';
  const type = /( me pagaron | pagaron | sueldo | nomina | quincena | ingreso | cobre | recibi | deposito | depositaron | vendi | venta | reembolso | aguinaldo | bono | gane )/.test(n) ? 'ingreso' : 'gasto';
  let date = new Date();
  if (/ (antier|anteayer) /.test(n)) date.setDate(date.getDate()-2); else if (/ ayer /.test(n)) date.setDate(date.getDate()-1);
  let d = rest.replace(/(^|\s)(ayer|antier|anteayer|hoy)(?=\s|$)/gi, ' ').replace(/\s+/g,' ').trim();
  d = d.replace(/^(me\s+)?(gast[eé]|pagu[eé]|compr[eé]|pagaron|depositaron|recib[ií]|cobr[eé]|gan[eé]|gasto|ingreso|pago)(?=\s|$)/i, '').trim();
  for (let i = 0; i < 3; i++) d = d.replace(/^(de|del|en|por|el|la|un|una|los|las|unos|unas)\s+/i, '').replace(/\s+(de|en|por)$/i, '').trim();
  return {amount, type, date: ymd(date), desc: cap(d) || (type==='ingreso' ? 'Ingreso' : 'Gasto')};
}

async function ask(q){
  q = q.trim(); if (!q || S.chatBusy || !S.ai) return;
  S.chat.push({role:'user', content:q}); const a = {role:'assistant', content:''}; S.chat.push(a); S.chatBusy = true; render();
  const intro = 'Eres el asesor financiero dentro de "Nuestro Nido", una app donde una pareja en México lleva sus finanzas. Responde en español de México, directo y cálido, en menos de 140 palabras, con cifras en pesos tomadas solo de estos datos; si falta un dato dilo. Usa viñetas con "- " cuando ayuden. No des asesoría de inversión específica.\n\nDatos (JSON):\n' + advisorContext() + '\n\nPregunta: ';
  const hist = S.chat.slice(0,-1).slice(-9).map(m => ({role: m.role, content: String(m.content)})); while (hist.length && hist[0].role !== 'user') hist.shift();
  hist[0] = {role:'user', content: intro + hist[0].content};
  const paint = () => { const box = $('#chat'); if (box && box.lastElementChild) { box.lastElementChild.innerHTML = md(a.content || 'Pensando…'); } };
  try { const r = await S.ai(hist, {cache:false, modelTier:'default', onText: u => { a.content = u.text; paint(); }}); a.content = r.text || a.content; }
  catch (e) { a.content = (e && e.text) || (e && e.code === 'not_granted' ? 'Para usar el asesor hay que aceptar el permiso de IA de esta página.' : e && e.code === 'rate_limited' ? 'Llegaste al límite de preguntas por ahora. Intenta en un rato.' : 'No pude responder en este momento. Intenta de nuevo.'); }
  S.chatBusy = false; render();
}

/* ---------- arranque ---------- */
async function boot(){
  const saved = ls.get('lana.tab'); if (saved && VIEWS[saved]) S.tab = saved;
  render();
  const c = window.claude;
  if (!c || !c.use) { S.loaded = true; S.local = true; render(); return; }
  const timer = setTimeout(() => { if (!S.loaded) { S.loaded = true; S.local = true; render(); } }, 10000);
  c.use('sample').then(ai => { S.ai = ai; if (S.loaded) render(); }).catch(() => {});
  let db = null; try { db = await c.use('db'); } catch (e) {}
  if (!db) { clearTimeout(timer); S.loaded = true; S.local = true; render(); return; }
  S.db = db; S.local = false;
  const rows = snap => snap.docs.map(d => ({id: d.id, ...d.data()}));
  const ready = k => { S.got[k] = 1; if (S.got.tx && S.got.goals && S.got.bills) { clearTimeout(timer); S.loaded = true; S.local = false; } if (S.loaded) render(); };
  const fail = () => { if (!S.loaded) { clearTimeout(timer); S.loaded = true; S.local = true; S.db = null; render(); } };
  db.collection('tx').orderBy('date','desc').limit(1000).onSnapshot(s => { S.tx = rows(s); ready('tx'); }, fail);
  db.collection('tx').where('type','==','ahorro').limit(1000).onSnapshot(s => { S.ahorroAll = rows(s); if (S.loaded) render(); }, () => {});
  db.collection('goals').onSnapshot(s => { S.goals = rows(s).sort((a,b) => (a.ts||0)-(b.ts||0)); ready('goals'); }, fail);
  db.collection('bills').onSnapshot(s => { S.bills = rows(s); ready('bills'); }, fail);
  db.collection('pics').limit(300).onSnapshot(s => { S.pics = Object.fromEntries(rows(s).map(r => [r.id, r])); if (S.loaded) render(); }, () => {});
  db.collection('config').onSnapshot(s => { s.docs.forEach(d => { const v = d.data() || {}; if (d.id === 'people') S.people = Array.isArray(v.names) ? v.names.filter(n => typeof n === 'string') : []; if (d.id === 'budgets') S.budgets = v.limits && typeof v.limits === 'object' ? v.limits : {}; if (d.id === 'rules') S.rules = v.map && typeof v.map === 'object' ? v.map : {}; }); if (S.loaded) render(); }, () => {});
  c.use('user').then(async u => { if (u && (await u.can('data.write')) === false) { S.readOnly = true; banner(); } }).catch(() => {});
}
boot();
