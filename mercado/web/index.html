<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado · Inteligencia de valor de futbolistas</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="barra">
  <a class="logo" href="#/mapa"><span class="logo-marca">M</span>Mercado</a>
  <nav id="nav">
    <a href="#/mapa" data-v="mapa">Mapa</a>
    <a href="#/radar" data-v="radar">Radar</a>
    <a href="#/explorar" data-v="explorar">Explorador</a>
    <a href="#/lista" data-v="lista">Mi lista <span id="n-lista" class="cuenta"></span></a>
    <a href="#/metodo" data-v="metodo">Metodología</a>
  </nav>
  <div class="buscador">
    <input id="buscar" type="search" placeholder="Buscar jugador o club…" autocomplete="off" aria-label="Buscar jugador o club">
    <ul id="sugerencias" hidden></ul>
  </div>
</header>

<details id="caja-filtros" class="filtros-caja">
  <summary><span>Filtros</span><span id="resumen-filtros" class="tenue"></span></summary>
  <div class="filtros">
    <label>Región<select id="f-region"></select></label>
    <label>País de la liga<select id="f-pais"></select></label>
    <label>Liga<select id="f-liga"></select></label>
    <label>División<select id="f-nivel"></select></label>
    <label>Posición<select id="f-pos"></select></label>
    <label>Rol<select id="f-subpos"></select></label>
    <label>Nacionalidad<select id="f-nac"></select></label>
    <label>Pie<select id="f-pie"></select></label>
    <label>Edad<span class="rango"><input id="f-emin" type="number" min="15" max="50" value="15"><span>–</span><input id="f-emax" type="number" min="15" max="50" value="50"></span></label>
    <label>Valor (€M)<span class="rango"><input id="f-vmin" type="number" min="0" step="0.1" placeholder="mín"><span>–</span><input id="f-vmax" type="number" min="0" step="0.1" placeholder="máx"></span></label>
    <label>Contrato vence<select id="f-contrato"></select></label>
    <label>Perfil<select id="f-perfil"></select></label>
    <label>Señal a 3 años<select id="f-senal"></select></label>
    <button id="limpiar" type="button">Limpiar</button>
  </div>
</details>

<main id="vista"></main>
<aside id="ficha" hidden aria-label="Ficha del jugador"></aside>
<div id="velo" hidden></div>

<footer class="pie tenue" id="pie"></footer>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
